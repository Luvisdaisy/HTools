name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          uname -m
      - name: Check generated project
        run: |
          python3 scripts/create-project.py
          git diff --exit-code -- HTools.xcodeproj
          git diff --check
      - name: Build and verify universal preview DMG
        run: ./scripts/package-dmg.sh
      - name: Run unit tests
        run: ./scripts/test.sh
      - name: Test shared keyboard core
        run: swift test --package-path KeyboardGuardPOC
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload preview installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-installer
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
